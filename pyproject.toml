[project]
name = "agentic-sdlc-showcase"
version = "1.0.0"
description = "Runnable reference implementation of the Synechron Agentic SDLC Playbook"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "pydantic>=2.9,<3",
    "uvicorn>=0.32,<0.40",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.8,<0.15",
]

[tool.setuptools.packages.find]
include = ["service*"]

[tool.pytest.ini_options]
testpaths = ["service/tests", "scripts/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
