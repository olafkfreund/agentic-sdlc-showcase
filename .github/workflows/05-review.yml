# Stage 5 — Deploy, review half. Agent review on every PR, identical for all of them.
#
# Findings inform; humans decide. Branch protection still requires a code owner's
# approval, and where we gate, we gate on the machine-readable severity tally and
# never on the narrative.
name: "Stage 5 — Review"

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-review:
    name: Request agent review
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The agent runtime is the replaceable component (§5.2). Which reviewer identity
      # to ask for comes from `.agent/runtimes.yaml`, so `make swap RUNTIME=<name>`
      # retargets this too. A runtime with no review capability declares `reviewer: null`
      # and the step says so rather than pretending.
      - id: reviewer
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, yaml
          doc = yaml.safe_load(pathlib.Path(".agent/runtimes.yaml").read_text())
          rt = doc["runtimes"][doc["selected"]]
          print(f"runtime={doc['selected']}")
          print(f"login={rt.get('reviewer') or ''}")
          PY

      - name: This runtime offers no review pass
        if: steps.reviewer.outputs.login == ''
        run: |
          {
            echo "## Agent review not requested"
            echo
            echo "Runtime \`${{ steps.reviewer.outputs.runtime }}\` declares no reviewer identity"
            echo "in \`.agent/runtimes.yaml\`, so no agent review will appear on this pull request."
            echo
            echo "**The deterministic gates are unaffected** — they are the control layer and they"
            echo "do not depend on any agent. Agent review is the fast, advisory layer (§5.4)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::runtime ${{ steps.reviewer.outputs.runtime }} has no review pass; the gates are unaffected."

      - name: Request review from the agent
        if: steps.reviewer.outputs.login != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEWER: ${{ steps.reviewer.outputs.login }}
        run: |
          set -uo pipefail
          gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
            -f "reviewers[]=$REVIEWER" >/dev/null 2>&1 || true

          # The API returns 200 and silently ignores the reviewer when the feature is
          # not enabled. A step that reports success while nothing happened is exactly
          # the control theatre this playbook argues against, so verify the reviewer
          # actually landed.
          REVIEWERS=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers" \
                        --jq '[.users[].login] | join(",")')
          echo "requested reviewers: ${REVIEWERS:-(none)}"

          # The API reports the login without the `[bot]` suffix the request carries.
          if echo "$REVIEWERS" | grep -qiF "${REVIEWER%%[[]bot[]]}"; then
            echo "AGENT REVIEW: requested" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Agent review NOT requested"
              echo
              echo "\`$REVIEWER\` did not land as a reviewer, so no agent review will appear"
              echo "on this pull request. The usual cause is that the feature is not enabled."
              echo
              echo "**The deterministic gates are unaffected** — they are the control layer"
              echo "and they do not depend on any agent. Agent review is the fast, advisory"
              echo "layer (playbook §5.4)."
              echo
              echo "To enable: Settings > Copilot > Policies > Copilot code review."
              echo "To use a different runtime: \`make swap RUNTIME=claude\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$REVIEWER did not land as a reviewer; no agent review was requested."
          fi

  review-passes:
    name: Review passes (REVIEW.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup

      # Three passes, defined in REVIEW.md so they are identical for every PR and
      # reviewable as a version-controlled artifact rather than a prompt someone typed.
      - name: Tally findings by severity
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python scripts/review_tally.py --pr "$PR"

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: evidence-review, path: evidence/ }
